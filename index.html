<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Code to UX — Interview-Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF9F2;
    --paper-card: #FFFEF9;
    --dot: #DAD4BE;
    --ink: #2C2A24;
    --ink-dim: #746C58;
    --line: #E0DCC8;
    --line-strong: #CDC6AC;
    --mustard: #EF9F27;
    --mustard-dark: #9C6B1F;
    --mustard-text: #412402;
    --coral: #D85A30;
    --green: #639922;
    --red: #C4453A;
    --correct-bg: #E8F0DA;
    --incorrect-bg: #F9E4E1;
    --correct-text: #3B5C1A;
    --incorrect-text: #8C2E25;
    --predict-bg: #FDF3DC;
    --serif: 'Source Serif 4', Georgia, serif;
    --hand: 'Caveat', cursive;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  [data-theme="dark"] {
    --paper: #1C1A16;
    --paper-card: #262320;
    --dot: #3A362E;
    --ink: #EDE8DB;
    --ink-dim: #A69D89;
    --line: #3A362E;
    --line-strong: #4E4A3F;
    --mustard: #F0B24A;
    --mustard-dark: #F0B24A;
    --mustard-text: #1C1A16;
    --coral: #E8886A;
    --green: #93C15C;
    --red: #E27C72;
    --correct-bg: #2B3A1C;
    --incorrect-bg: #3B211D;
    --correct-text: #B9E38C;
    --incorrect-text: #F0AFA6;
    --predict-bg: #2E2818;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 16px 16px;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    min-height: 100vh;
    transition: background-color 0.2s, color 0.2s;
  }
  ::selection { background: #F0D9A8; }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border: 1.5px solid var(--line-strong);
    color: var(--ink-dim);
    padding: 6px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .theme-toggle:hover { border-color: var(--mustard-dark); color: var(--ink); }

  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 280px;
    background: var(--paper-card);
    border-right: 1px dashed var(--line-strong);
    padding: 28px 18px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .main { flex: 1; padding: 44px 52px; max-width: 820px; }
  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px dashed var(--line-strong); }
    .main { padding: 28px 20px; max-width: 100%; }
  }

  .brand {
    font-family: var(--hand);
    font-size: 26px;
    font-weight: 700;
    color: var(--mustard-dark);
    margin-bottom: 0px;
    line-height: 1.1;
  }
  .brand-sub { color: var(--ink-dim); font-size: 12px; margin-bottom: 22px; font-family: var(--sans); }

  .overall-bar {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 22px;
    border: 1px solid var(--line-strong);
  }
  .overall-fill {
    height: 100%;
    background: var(--mustard);
    transition: width 0.4s ease;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--ink-dim);
    margin-bottom: 2px;
    transition: background 0.15s;
  }
  .nav-item:hover { background: var(--paper); color: var(--ink); }
  .nav-item.active { background: var(--paper); color: var(--mustard-dark); font-weight: 600; }
  .nav-num {
    font-family: var(--serif);
    font-size: 12px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--paper-card);
  }
  .nav-item.complete .nav-num { background: var(--mustard); border-color: var(--mustard); color: var(--mustard-text); }
  .nav-item.active .nav-num { border-color: var(--mustard-dark); }

  .eyebrow {
    font-family: var(--hand);
    font-size: 20px;
    color: var(--coral);
    margin-bottom: 2px;
  }
  h1 {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
    text-decoration: underline;
    text-decoration-color: var(--mustard);
    text-decoration-thickness: 4px;
    text-underline-offset: 6px;
  }
  .module-framing { color: var(--ink-dim); font-size: 16px; margin-bottom: 30px; max-width: 640px; font-family: var(--serif); font-style: italic; }

  h2 {
    font-family: var(--hand);
    font-size: 22px;
    color: var(--mustard-dark);
    margin: 34px 0 12px;
  }
  h3 { font-family: var(--serif); font-size: 17px; font-weight: 700; margin: 16px 0 8px; color: var(--coral); }
  p { margin-bottom: 12px; color: var(--ink); font-size: 15px; }
  ul, ol { margin: 0 0 14px 22px; }
  li { margin-bottom: 6px; font-size: 15px; }
  strong { color: var(--mustard-dark); font-weight: 700; }

  .card {
    background: var(--paper-card);
    border: 1.5px dashed var(--line-strong);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
    position: relative;
  }
  .card.exercise { border-color: var(--coral); border-style: solid; border-width: 1px 1px 1px 4px; }
  .card.casestudy { border-color: var(--green); border-style: solid; border-width: 1px 1px 1px 4px; }
  .card-label {
    font-family: var(--hand);
    font-size: 17px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .card.exercise .card-label { color: var(--coral); }
  .card.casestudy .card-label { color: var(--green); }

  .quiz-block {
    background: var(--paper-card);
    border: 1.5px solid var(--line-strong);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 14px;
    box-shadow: 3px 3px 0 var(--line);
  }
  .quiz-q { font-weight: 700; margin-bottom: 12px; font-size: 15px; font-family: var(--serif); }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--paper);
    border: 1.5px solid var(--line-strong);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 7px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 14px;
    font-family: var(--sans);
    transition: all 0.15s;
  }
  .quiz-opt:hover:not(.answered) { border-color: var(--mustard-dark); background: var(--paper); color: var(--ink); }
  .quiz-opt.correct { background: var(--correct-bg); border-color: var(--green); color: var(--correct-text); font-weight: 600; }
  .quiz-opt.incorrect { background: var(--incorrect-bg); border-color: var(--red); color: var(--incorrect-text); }
  .quiz-opt.answered { cursor: default; }
  .quiz-feedback { font-size: 13px; color: var(--ink-dim); margin-top: 8px; display: none; font-family: var(--serif); font-style: italic; }
  .quiz-feedback.show { display: block; }

  .predict-box {
    background: var(--predict-bg);
    border: 2px dashed var(--mustard);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 20px;
  }
  .predict-scenario { font-size: 15px; margin-bottom: 14px; padding: 12px 14px; background: var(--paper-card); border-radius: 8px; font-family: var(--serif); font-style: italic; color: var(--ink); border: 1px solid var(--line); }
  .predict-btns { display: flex; gap: 10px; margin-bottom: 10px; }
  .predict-btn {
    flex: 1;
    padding: 12px;
    background: var(--paper-card);
    border: 1.5px solid var(--line-strong);
    color: var(--ink);
    border-radius: 7px;
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
  }
  .predict-btn:hover:not(:disabled) { border-color: var(--mustard-dark); background: var(--paper); color: var(--ink); }
  .predict-result { font-size: 14px; margin-top: 10px; padding: 12px; border-radius: 7px; display: none; font-family: var(--serif); }
  .predict-result.show { display: block; }

  .footer-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px dashed var(--line-strong);
  }
  .nav-btn {
    background: var(--mustard);
    color: var(--mustard-text);
    border: none;
    padding: 12px 22px;
    border-radius: 7px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: var(--sans);
    box-shadow: 3px 3px 0 var(--mustard-dark);
  }
  .nav-btn.ghost {
    background: transparent;
    border: 1.5px solid var(--line-strong);
    color: var(--ink-dim);
    box-shadow: none;
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; box-shadow: none; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">From Code → UX</div>
    <div class="brand-sub">Interview-Ready Course</div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀ Light mode</button>
    <div class="overall-bar"><div class="overall-fill" id="overallFill"></div></div>
    <div id="navList"></div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<script>
const modules = [
{
  title: "Reframing How You Think",
  framing: "You already think in systems — inputs, outputs, state changes. UX uses a different system: the human mind. This module rewires how you observe interfaces.",
  sections: [
    {h:"Theory", body:`
      <h3>The Gulf of Execution & the Gulf of Evaluation</h3>
      <p><strong>Gulf of Execution</strong>: the distance between what a user wants to do and what the interface lets them do easily. If a user has to guess or interpret before acting, this gulf is wide.</p>
      <p><strong>Gulf of Evaluation</strong>: the distance between an action and the user knowing what happened. Tap "send" with no confirmation? Wide gulf.</p>
      <p>As a developer, your system always tells you what happened — a log, a return value. Users don't get that by default. Every toast message or spinner is you manually closing the gulf of evaluation for a human.</p>
      <h3>Mental Models vs. Conceptual Models vs. System Image</h3>
      <p><strong>Mental model</strong>: what the user believes about the system, built from prior experience — often incomplete or wrong.</p>
      <p><strong>Conceptual model</strong>: what you intend to communicate.</p>
      <p><strong>System image</strong>: what the interface actually communicates — the only one users can see.</p>
      <p>Design fails when system image doesn't match the user's mental model — even if your conceptual model was "correct." You can't argue a user into a new mental model; you design around the one they already have.</p>
      <h3>Cognitive Load</h3>
      <p>Every decision costs mental effort. Simplicity isn't fewer features — it's <strong>progressive disclosure</strong>: hide complexity until needed. Working memory holds ~3-4 chunks at once; multi-step flows that require remembering step 1 while on step 3 will fail for most users.</p>
      <h3>Affordances and Signifiers</h3>
      <p><strong>Affordance</strong>: what an object actually allows (a button can be clicked). <strong>Signifier</strong>: the visual cue telling you the affordance exists (it looks clickable). Most "bad UX" is a missing signifier, not a missing affordance.</p>
    `},
    {h:"Predict the Gulf", predict:{
      scenario:"A user taps 'Delete Account.' The screen freezes for 4 seconds with no spinner, no message. Then the account is deleted.",
      options:["Gulf of Execution","Gulf of Evaluation"],
      correct:1,
      explain:"The user could execute the action fine (they found and tapped the button) — the failure is not knowing what happened during those 4 silent seconds. That's Gulf of Evaluation."
    }},
    {h:"Exercise", exercise:"Redesign a signup form you'd normally 'just build.' For every field and button, annotate: does this widen or narrow the gulf of execution? The gulf of evaluation? Where is the affordance missing a signifier?"},
    {h:"Case Study to Study", casestudy:"Norman's classic door example — a flat handle that visually signals 'push' but must be pulled. Find a digital equivalent (e.g. a toggle whose 'on' state color doesn't clearly read as on). Write two sentences on exactly why it fails, using the vocabulary above."}
  ],
  quiz: [
    {q:"A user clicks 'Submit' and nothing visibly changes for 3 seconds. Which gulf is this?", opts:["Gulf of Execution","Gulf of Evaluation","Neither","Both"], correct:1, fb:"Nothing communicated the outcome — that's a Gulf of Evaluation problem."},
    {q:"A new user assumes a trash-can icon means 'archive,' based on another app. This is a mismatch between:", opts:["Conceptual model and system image","Mental model and system image","Gulf of execution and cognitive load","None"], correct:1, fb:"Their prior experience (mental model) doesn't match what your icon actually communicates (system image)."},
    {q:"'Progressive disclosure' means:", opts:["Showing all options at once","Hiding information permanently","Revealing complexity only when needed","A color technique"], correct:2, fb:"It's about sequencing complexity, not deleting it."},
    {q:"A flat button with no shadow, no color difference, no hover state that IS clickable is missing its:", opts:["Affordance","Signifier","Gulf of execution","Mental model"], correct:1, fb:"The affordance (clickability) exists — the visual cue announcing it doesn't."},
    {q:"Working memory limitations mean multi-step flows should:", opts:["Require users to remember earlier steps","Avoid requiring memory across steps","Always be single-page","Have no bearing on design"], correct:1, fb:"Show relevant info at each step rather than making users hold it in their head."}
  ]
},
{
  title: "Heuristics & Laws",
  framing: "Module 1 taught you to see problems. This module gives you a checklist to name them precisely — this vocabulary is what separates 'this feels off' from an interview-ready critique.",
  sections: [
    {h:"Theory — Nielsen's 10 Usability Heuristics", body:`
      <ol>
        <li><strong>Visibility of system status</strong> — keep users informed through timely feedback.</li>
        <li><strong>Match with the real world</strong> — use familiar language, not jargon.</li>
        <li><strong>User control and freedom</strong> — support undo/redo, an emergency exit.</li>
        <li><strong>Consistency and standards</strong> — don't make users guess if different words mean the same thing.</li>
        <li><strong>Error prevention</strong> — better than a good error message is preventing it entirely.</li>
        <li><strong>Recognition over recall</strong> — minimize memory load; make options visible.</li>
        <li><strong>Flexibility and efficiency</strong> — accelerators for experts, invisible to novices.</li>
        <li><strong>Aesthetic and minimalist design</strong> — every extra unit competes with relevant ones.</li>
        <li><strong>Help recognize/diagnose/recover from errors</strong> — plain language, precise, constructive.</li>
        <li><strong>Help and documentation</strong> — searchable, focused on the user's task.</li>
      </ol>
    `},
    {h:"Theory — Named Laws", body:`
      <p><strong>Jakob's Law</strong> — users spend most of their time on other products, so they expect yours to behave the same way.</p>
      <p><strong>Fitts's Law</strong> — time to acquire a target depends on its size and distance. Bigger, closer targets = faster interaction.</p>
      <p><strong>Hick's Law</strong> — decision time increases with the number and complexity of choices.</p>
      <p><strong>Miller's Law</strong> — average working memory holds ~7 (±2) items — chunk information into small groups.</p>
      <p><strong>Von Restorff Effect</strong> — an item that differs from its surroundings is more likely to be noticed/remembered.</p>
    `},
    {h:"Exercise", exercise:"Pick an app you use daily. Find at least 3 heuristic violations. For each, name the heuristic, describe the violation in one sentence, and propose a specific fix."},
    {h:"Redesign Exercise", exercise:"Take a checkout flow from a real e-commerce site. Find a screen presenting too many simultaneous choices (Hick's Law violation). Redesign it to reduce decisions-per-screen. Justify the change using the law by name."}
  ],
  quiz: [
    {q:"A dropdown with 40 unsorted options violates:", opts:["Fitts's Law","Hick's Law","Jakob's Law","Heuristic #8"], correct:1, fb:"Too many undifferentiated choices slows decision-making — classic Hick's Law."},
    {q:"A swipe-to-delete gesture with no precedent in similar apps and no onboarding risks violating:", opts:["Jakob's Law","Fitts's Law","Heuristic #10","None"], correct:0, fb:"It breaks the convention users bring from other apps."},
    {q:"An error message that just says 'Error 402' violates:", opts:["Visibility of system status","Recognize/diagnose/recover from errors","Consistency and standards","Aesthetic and minimalist design"], correct:1, fb:"It gives no path to understanding or fixing the problem."},
    {q:"A single bright orange CTA among many gray buttons uses:", opts:["Fitts's Law","Von Restorff Effect","Miller's Law","Heuristic #4"], correct:1, fb:"Standing out from surroundings makes it memorable/noticeable — Von Restorff."},
    {q:"Grouping a long settings list into 5-item chunks with headers respects:", opts:["Jakob's Law","Miller's Law","Fitts's Law","Heuristic #9"], correct:1, fb:"Chunking respects working memory limits — Miller's Law."}
  ]
},
{
  title: "Visual & Interaction Fundamentals",
  framing: "This is the module where coders usually feel most exposed — visual literacy isn't innate, it's a set of learnable rules, same as any syntax.",
  sections: [
    {h:"Theory — Gestalt Principles (full set)", body:`
      <ol>
        <li><strong>Proximity</strong> — elements close together are perceived as related.</li>
        <li><strong>Similarity</strong> — shared color/shape/size implies grouping, even without a border.</li>
        <li><strong>Closure</strong> — the eye completes incomplete shapes.</li>
        <li><strong>Continuity</strong> — aligned elements along a line/curve are perceived as connected.</li>
        <li><strong>Figure-Ground</strong> — the eye separates subject from background; weak contrast breaks this.</li>
        <li><strong>Common Region</strong> — elements inside a shared boundary (card, box) read as grouped.</li>
        <li><strong>Symmetry & Order (Prägnanz)</strong> — the eye defaults to the simplest interpretation available.</li>
      </ol>
    `},
    {h:"Theory — Typography", body:`
      <p><strong>Font pairing</strong>: one typeface for headings, one for body. More than 2 typefaces usually signals inexperience.</p>
      <p><strong>Type scale</strong>: a consistent ratio (e.g. 1.25x or 1.5x) between heading/subheading/body sizes.</p>
      <p><strong>Line height</strong>: body text needs ~1.4–1.6x its font size.</p>
      <p><strong>Line length</strong>: ~45–75 characters per line is the readable range.</p>
      <p><strong>Weight as hierarchy</strong>: bold vs. regular creates hierarchy without changing size — useful in dense UIs.</p>
    `},
    {h:"Theory — Hierarchy, Grids & Layout", body:`
      <p>Visual hierarchy is the order in which a user's eye is guided — built from size, weight, color, contrast, spacing, and position. If everything is emphasized, nothing is.</p>
      <p><strong>Grid systems</strong>: 12-column grids are the responsive web standard; consistent gutters keep layout predictable.</p>
      <p><strong>Alignment</strong>: every element should align to something, never eyeballed.</p>
      <p><strong>White space</strong>: not wasted space — it lets grouped content breathe.</p>
      <p><strong>Responsive breakpoints</strong>: mobile-first — design the constrained case first.</p>
    `},
    {h:"Theory — Color & Contrast", body:`
      <p><strong>60-30-10 rule</strong>: 60% dominant color, 30% secondary, 10% accent — prevents visual chaos.</p>
      <p><strong>Semantic color</strong>: red=error, green=success, yellow=warning — deviate carefully (Jakob's Law).</p>
      <p><strong>Contrast ratio</strong>: WCAG AA = 4.5:1 for normal text, 3:1 for large text.</p>
      <p><strong>Color is never standalone</strong> — always pair with icon or text for accessibility.</p>
    `},
    {h:"Exercise", exercise:"Take a screen with 3+ unrelated content groups. Apply at least 3 Gestalt principles to visually separate them — annotate which principle you used and where."},
    {h:"Redesign Exercise", exercise:"Take a text-heavy screen with no clear hierarchy. Redesign using ONLY spacing and type scale — no color allowed."},
    {h:"Case Study to Study", casestudy:"Find a public before/after rebrand. Write up what changed structurally (grouping, hierarchy, spacing, grid) — not just 'it looks nicer.'"}
  ],
  quiz: [
    {q:"A card with a visible border grouping unrelated-looking icons uses:", opts:["Similarity","Common Region","Closure","Continuity"], correct:1, fb:"The shared boundary — the card itself — creates the grouping."},
    {q:"The 60-30-10 rule refers to:", opts:["Grid widths","A color distribution ratio","Contrast thresholds","Type scale"], correct:1, fb:"It's a proportion for dominant, secondary, and accent color usage."},
    {q:"Body text line height should generally be:", opts:["Same as font size","1.4–1.6x font size","3x font size","Irrelevant to readability"], correct:1, fb:"This range keeps lines readable without feeling disconnected."},
    {q:"Using bold weight instead of larger size to create hierarchy is useful when:", opts:["Never valid","Space is limited and size can't grow","Only for headings","Breaking WCAG rules"], correct:1, fb:"Weight is a space-efficient hierarchy tool, especially in dense UIs."},
    {q:"WCAG AA minimum contrast for normal body text:", opts:["2:1","3:1","4.5:1","7:1"], correct:2, fb:"4.5:1 is the AA standard for normal-sized text."},
    {q:"A dashed line connecting two distant icons relies on which principle?", opts:["Similarity","Continuity","Closure","Figure-Ground"], correct:1, fb:"The eye follows the implied path — that's continuity."}
  ]
},
{
  title: "Research & Testing Literacy",
  framing: "Design decisions without research are opinions. This module gives you the minimum research literacy to defend a decision with evidence, not taste.",
  sections: [
    {h:"Theory", body:`
      <h3>Qualitative vs. Quantitative Research</h3>
      <p><strong>Qualitative</strong>: answers why — interviews, usability tests. Small sample, deep insight per person.</p>
      <p><strong>Quantitative</strong>: answers how many/how much — analytics, A/B tests, surveys at scale.</p>
      <h3>Why 5 Users?</h3>
      <p>Nielsen's research found testing with 5 users surfaces ~85% of usability problems in a single round. More users mostly reveal issues you've already found — better to test 5, fix, retest.</p>
      <h3>When to Use What</h3>
      <p>Problem unclear / need to understand why → qualitative. Validating a known change at scale → quantitative.</p>
      <h3>Common Methods</h3>
      <ul>
        <li><strong>Usability testing</strong> — watch someone attempt a task, note struggles.</li>
        <li><strong>Contextual inquiry</strong> — observe users in their real environment.</li>
        <li><strong>Surveys</strong> — quantitative, self-reported, weak on "why."</li>
        <li><strong>A/B testing</strong> — compares variants, needs sufficient traffic.</li>
        <li><strong>Card sorting</strong> — informs information architecture (grouping/labeling).</li>
      </ul>
    `},
    {h:"Exercise", exercise:"Run an actual 5-user test on a friend/colleague using a live app. Write a findings report: where did they hesitate, backtrack, or misinterpret something?"},
    {h:"Case Study Practice", casestudy:"Turn that test into a one-page case study: problem → method → findings → recommendation."}
  ],
  quiz: [
    {q:"Why 5 users instead of 20?", opts:["Budget only","5 surfaces most usability issues; iterate and retest instead","Statistically invalid otherwise","Legal minimum"], correct:1, fb:"Nielsen's research shows diminishing returns past 5 in a single round."},
    {q:"Comparing Button A vs. Button B click-through calls for:", opts:["Usability test","A/B test (quantitative)","Interview","Heuristic evaluation"], correct:1, fb:"You need scale and statistical comparison — A/B testing."},
    {q:"Qualitative research is best used when:", opts:["You need a large sample","The problem is still unclear","You want statistical significance","Validating a shipped feature"], correct:1, fb:"Qualitative work shines when you need to understand 'why,' not just measure."},
    {q:"Card sorting is primarily used to inform:", opts:["Color choices","Information architecture / grouping and labeling","Typography","Contrast ratios"], correct:1, fb:"It reveals how users naturally group and label content."}
  ]
},
{
  title: "The Hiring Simulation",
  framing: "Everything so far is now ammunition. This module is pure interview rehearsal — question categories, sample questions, and what a hiring manager is actually listening for.",
  sections: [
    {h:"Foundational / 'Prove You Understand Design' Questions", body:`
      <p>Almost always asked early, especially to candidates transitioning from technical backgrounds.</p>
      <ul>
        <li><strong>What is design?</strong> — Strong: decision-making under constraints to solve a human problem. Weak: "making things look nice."</li>
        <li><strong>Why do you want to be a designer?</strong> — Strong answers show curiosity about behavior, not escape from code.</li>
        <li><strong>What's the difference between UI and UX?</strong> — UX is the full problem-solving process (research, flows, IA). UI is the visual/interactive surface. UX without UI is an unpolished wireframe; UI without UX is a beautiful screen solving the wrong problem.</li>
        <li><strong>What's the difference between UX design and UX research?</strong></li>
        <li><strong>What is a design system, and why does it matter?</strong></li>
        <li><strong>What does "good design" mean to you?</strong></li>
        <li><strong>Name a product with bad UX and explain why. Name one with great UX and explain why.</strong></li>
      </ul>
    `},
    {h:"Portfolio & Process Questions", body:`<ul><li>Walk me through one project from problem to shipped solution.</li><li>What was the worst decision you made on this project, and how did you recover?</li><li>Show me a screen you'd redesign today. Why?</li></ul>`},
    {h:"Whiteboard / Design Thinking Questions", body:`<ul><li>Redesign the checkout flow for [common app] — think out loud.</li><li>How would you improve onboarding for a fitness app?</li><li>Critique this screen in 60 seconds.</li></ul>`},
    {h:"Usability & Heuristics Questions", body:`<ul><li>What usability heuristics does this interface violate?</li><li>How would you test whether this design actually works?</li><li>What's the difference between usability and UX?</li></ul>`},
    {h:"Coder-to-Designer Specific Questions", body:`<ul><li>How do you work with engineers when a design isn't technically feasible?</li><li>Have you ever pushed back on a PM's requirement? What happened?</li><li>Since you code — how do you decide when to prototype in Figma vs. in code?</li></ul>`},
    {h:"Metrics & Business Questions", body:`<ul><li>How would you measure the success of this redesign?</li><li>Tell me about a time data changed your design decision.</li></ul>`},
    {h:"Behavioral Questions", body:`<ul><li>Tell me about a time you got difficult feedback on your work.</li><li>Describe a disagreement with a stakeholder and how you resolved it.</li></ul>`},
    {h:"Redesign-on-the-Spot Drill", exercise:"Pick a random common app screen. 60 seconds. Talk through a redesign out loud. Record yourself. Review against the theory checklist from Modules 1-4."}
  ],
  quiz: [
    {q:"Best one-line distinction between UI and UX:", opts:["UI is code, UX is design","UI is the visual/interactive surface; UX is the full problem-solving process","They are the same thing","UX is only research"], correct:1, fb:"UX encompasses the full process; UI is the surface it results in."},
    {q:"A weak answer to 'what is design?' sounds like:", opts:["'Solving a human problem within constraints'","'Making things look nice and modern'","'Reducing friction between user goals and system behavior'","Both a and c are strong"], correct:1, fb:"This answer misses the problem-solving and constraint-navigation core of design."},
    {q:"A hiring manager asks 'why UX, not dev?' They're mainly filtering for:", opts:["Technical skill level","Genuine curiosity about behavior vs. escaping code","Salary expectations","Portfolio quality"], correct:1, fb:"This question is about motivation, not competence."}
  ]
},
{
  title: "Capstone Portfolio",
  framing: "Knowledge without proof of work doesn't get you hired. This is where you build the 2-3 pieces you'll actually show in an interview.",
  sections: [
    {h:"Deliverable Requirement", body:"<p>2-3 full case studies. At least one must be a <strong>redesign of an existing product</strong> — the most common junior portfolio format hiring managers expect.</p>"},
    {h:"Project 1 — Food Delivery Cart/Checkout Redesign", body:`
      <p><strong>Brief:</strong> Redesign the "Add to Cart → Checkout" flow for a real food delivery app (Swiggy, Zomato, Uber Eats, DoorDash).</p>
      <p><strong>Constraints:</strong></p>
      <ul>
        <li>No new screens — modify only the existing 3-4 screens.</li>
        <li>At least one change justified by a named heuristic or law.</li>
        <li>At least one change justified by a Gestalt/visual principle.</li>
        <li>Identify a real usability problem in the current app first — don't invent one.</li>
      </ul>
      <p><strong>Process:</strong> Problem statement (be specific) → mini research (2-3 people attempt the flow) → redesign with one-sentence justification per change → iterate based on one person's reaction → write the case study (Problem → Constraints → Process → Why → What's next).</p>
      <p><strong>Scoring criteria:</strong> Did they find a real problem? Did they name actual principles? Is there evidence of iteration? Can they explain a tradeoff made under constraints?</p>
    `},
    {h:"Project 2 — SaaS Dashboard Redesign", body:`
      <p><strong>Brief:</strong> Redesign a data-heavy dashboard screen (analytics tool, project management tool).</p>
      <p><strong>Constraints:</strong> Must handle 3+ distinct data types on one screen. Apply 2+ Gestalt principles for grouping. Justify one hierarchy decision using type scale/weight, not color. Identify a real information-overload problem first.</p>
      <p>Same 5-step process and scoring criteria as Project 1.</p>
    `},
    {h:"Project 3 — Your Choice, With Guardrails", body:`
      <p><strong>Brief:</strong> Pick a product you use regularly and find frustrating. Redesign one flow, not the whole product.</p>
      <p><strong>Constraints:</strong> Scope must be a single flow. Must include one written trade-off you didn't solve, and why — interviewers respect awareness of unsolved constraints more than pretending everything is fixed.</p>
    `}
  ],
  quiz: [
    {q:"What's the single most expected portfolio format for a junior UX candidate?", opts:["An original app idea","A redesign of an existing product","A branding project","A hackathon project"], correct:1, fb:"Redesigns show you can identify and solve real problems, not just invent ideas."},
    {q:"In Project 3, why is documenting an unsolved trade-off valuable?", opts:["It shows you ran out of time","It shows awareness of constraints, which reads as maturity","It's required for grading only","It isn't valuable"], correct:1, fb:"Interviewers respect honest awareness of trade-offs over pretending everything was solved."}
  ]
},
{
  title: "Motivation Narrative",
  framing: "Technical correctness won't save an answer that sounds like you're running away from code instead of running toward design.",
  sections: [
    {h:"Theory", body:"<p>Hiring managers ask 'why UX, not dev?' to filter for genuine curiosity about human behavior versus frustration with programming. The strongest answers reference a specific moment of noticing a usability problem while building something — not general dissatisfaction with coding.</p>"},
    {h:"Exercise 1", exercise:"Write and rehearse a 90-second answer to 'why do you want to move into UX?' — no notes, recorded, reviewed."},
    {h:"Exercise 2 — The Opening Sequence", exercise:"These three questions are often chained together at the start of a real interview, before any technical question. Write one paragraph each: (1) What is design, in your own words? (2) Why design, and why now, given your coding background? (3) What's a product you personally think has bad UX, and why?"}
  ],
  quiz: [
    {q:"A weak answer to 'why UX?' sounds like:", opts:["'I got curious about why users behave a certain way while building features'","'I'm tired of debugging and want something easier'","'I started noticing usability problems in what I was building'","Both a and c are strong"], correct:1, fb:"This frames UX as an escape from code rather than a genuine pull toward design."}
  ]
},
{
  title: "Iteration After Rejection",
  framing: "Job hunting involves repeated rejection. Without a system to learn from it, people quit after 2-3 tries. This module is that system.",
  sections: [
    {h:"Theory — The Three-Bucket Debrief Framework", body:`
      <p>After any rejection or mock failure, sort what went wrong into exactly one bucket:</p>
      <ul>
        <li><strong>Theory gap</strong> — didn't actually know a concept.</li>
        <li><strong>Nerves</strong> — knew it, froze under pressure.</li>
        <li><strong>Narrative gap</strong> — technically correct, but poorly framed or communicated.</li>
      </ul>
      <p>Mixing these up wastes effort — over-studying theory when the real issue was delivery, or over-rehearsing delivery when there's an actual knowledge gap.</p>
    `},
    {h:"Exercise", exercise:"Take a real answer you gave during the Module 5 redesign-on-the-spot drill. Debrief it into one of the three buckets. Write a one-sentence fix specific to that bucket."}
  ],
  quiz: [
    {q:"You knew the correct heuristic but blanked on its name mid-interview. This is:", opts:["Theory gap","Nerves","Narrative gap","Not fixable"], correct:1, fb:"You had the knowledge — pressure caused the block. That's nerves."},
    {q:"You gave a technically correct redesign but the interviewer looked confused throughout. This is likely:", opts:["Theory gap","Nerves","Narrative gap","Not fixable"], correct:2, fb:"The content was right, but the delivery/framing didn't land — narrative gap."}
  ]
}
];

let state = JSON.parse(localStorage.getItem('uxCourseProgress') || '{}');
let currentModule = state.currentModule || 0;

function saveState() {
  localStorage.setItem('uxCourseProgress', JSON.stringify(state));
}
function isModuleComplete(idx) {
  return state[`m${idx}_complete`] === true;
}
function markComplete(idx) {
  state[`m${idx}_complete`] = true;
  saveState();
  renderNav();
  updateOverallBar();
}
function updateOverallBar() {
  const total = modules.length;
  let done = 0;
  for (let i = 0; i < total; i++) if (isModuleComplete(i)) done++;
  document.getElementById('overallFill').style.width = (done/total*100) + '%';
}
function renderNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  modules.forEach((m, i) => {
    const item = document.createElement('div');
    item.className = 'nav-item' + (i === currentModule ? ' active' : '') + (isModuleComplete(i) ? ' complete' : '');
    item.innerHTML = `<span class="nav-num">${isModuleComplete(i) ? '✓' : i+1}</span><span>${m.title}</span>`;
    item.onclick = () => { currentModule = i; state.currentModule = i; saveState(); renderNav(); renderModule(); window.scrollTo(0,0); };
    nav.appendChild(item);
  });
}
function renderModule() {
  const m = modules[currentModule];
  const main = document.getElementById('mainContent');
  let html = `
    <div class="eyebrow">Module ${currentModule + 1} of ${modules.length}</div>
    <h1>${m.title}</h1>
    <p class="module-framing">${m.framing}</p>
  `;
  m.sections.forEach((s, si) => {
    if (s.h) html += `<h2>${s.h}</h2>`;
    if (s.body) html += s.body;
    if (s.exercise) html += `<div class="card exercise"><div class="card-label">Exercise</div><p>${s.exercise}</p></div>`;
    if (s.casestudy) html += `<div class="card casestudy"><div class="card-label">Case study</div><p>${s.casestudy}</p></div>`;
    if (s.predict) html += renderPredict(s.predict, `predict_${currentModule}_${si}`);
  });
  html += `<h2>Quiz — check your understanding</h2><div id="quizContainer"></div>`;
  html += `
    <div class="footer-nav">
      <button class="nav-btn ghost" id="prevBtn" ${currentModule === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="nav-btn" id="nextBtn">${currentModule === modules.length - 1 ? 'Finish course' : 'Next module →'}</button>
    </div>
  `;
  main.innerHTML = html;
  renderQuiz(m.quiz);
  document.getElementById('prevBtn').onclick = () => {
    if (currentModule > 0) { currentModule--; state.currentModule = currentModule; saveState(); renderNav(); renderModule(); window.scrollTo(0,0); }
  };
  document.getElementById('nextBtn').onclick = () => {
    markComplete(currentModule);
    if (currentModule < modules.length - 1) {
      currentModule++; state.currentModule = currentModule; saveState(); renderNav(); renderModule(); window.scrollTo(0,0);
    } else {
      renderFinish();
    }
  };
}
function renderPredict(p, key) {
  return `
    <div class="predict-box" id="${key}">
      <div class="card-label">Predict first</div>
      <div class="predict-scenario">${p.scenario}</div>
      <div class="predict-btns">
        ${p.options.map((o, i) => `<button class="predict-btn" onclick="answerPredict('${key}', ${i}, ${p.correct})">${o}</button>`).join('')}
      </div>
      <div class="predict-result" id="${key}_result"></div>
    </div>
  `;
}
window.answerPredict = function(key, chosen, correct) {
  const box = document.getElementById(key);
  const btns = box.querySelectorAll('.predict-btn');
  btns.forEach(b => b.disabled = true);
  const result = document.getElementById(key + '_result');
  const module = modules[currentModule];
  const section = module.sections.find(s => s.predict);
  const explain = section.predict.explain;
  const isCorrect = chosen === correct;
  result.className = 'predict-result show';
  result.style.background = isCorrect ? '#E8F0DA' : '#F9E4E1';
  result.style.border = '1.5px solid ' + (isCorrect ? 'var(--green)' : 'var(--red)');
  result.innerHTML = `<strong>${isCorrect ? 'Correct.' : 'Not quite.'}</strong> ${explain}`;
};
function renderQuiz(quiz) {
  const container = document.getElementById('quizContainer');
  container.innerHTML = quiz.map((q, qi) => `
    <div class="quiz-block">
      <div class="quiz-q">${qi+1}. ${q.q}</div>
      ${q.opts.map((o, oi) => `<button class="quiz-opt" data-qi="${qi}" data-oi="${oi}" onclick="answerQuiz(this, ${qi}, ${oi}, ${q.correct})">${o}</button>`).join('')}
      <div class="quiz-feedback" id="fb_${qi}"></div>
    </div>
  `).join('');
}
window.answerQuiz = function(btn, qi, oi, correct) {
  const block = btn.closest('.quiz-block');
  const opts = block.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.classList.add('answered'));
  opts[correct].classList.add('correct');
  if (oi !== correct) opts[oi].classList.add('incorrect');
  const m = modules[currentModule];
  const fb = document.getElementById(`fb_${qi}`);
  fb.className = 'quiz-feedback show';
  fb.textContent = m.quiz[qi].fb;
};
function renderFinish() {
  document.getElementById('mainContent').innerHTML = `
    <div class="eyebrow">Course complete</div>
    <h1>You've finished all 8 modules</h1>
    <p class="module-framing">You now have the theory, the vocabulary, the exercises, and the interview question bank. The remaining work is repetition: redo the redesign-on-the-spot drill weekly, keep refining your capstone case studies, and rehearse your motivation narrative until it's automatic.</p>
    <div class="card">
      <div class="card-label">Suggested next step</div>
      <p>Go back to Module 6 and finish your 2-3 capstone case studies if you haven't — that's the single deliverable interviewers will actually ask to see.</p>
    </div>
    <div class="footer-nav">
      <button class="nav-btn ghost" onclick="currentModule=0; state.currentModule=0; saveState(); renderNav(); renderModule(); window.scrollTo(0,0);">← Back to Module 1</button>
    </div>
  `;
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  btn.textContent = theme === 'dark' ? '☾ Dark mode' : '☀ Light mode';
  localStorage.setItem('uxCourseTheme', theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('uxCourseTheme') || 'light');

renderNav();
renderModule();
updateOverallBar();
</script>
</body>
</html>
